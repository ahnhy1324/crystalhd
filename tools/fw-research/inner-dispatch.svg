<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title description">
  <title id="title">Conditional BCM70015 inner codec dispatcher</title>
  <desc id="description">Pinned stock bytes trace a shared packet prefix through cached context selection to six internal codec paths. The context return is unchecked. This is a conditional static projection, not hardware codec support or a reusable backend API.</desc>
  <rect width="1120" height="480" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="32" y="34" font-size="22" font-weight="bold">Inner codec selection: conditional static projection</text>
    <text x="32" y="57" font-size="14">Stock BCM70015 bytes; GNU ARC STATUS next-word-PC assumption. No device execution.</text>
    <g stroke="#94a3b8" stroke-width="1.5">
      <rect x="32" y="84" width="246" height="100" rx="8" fill="#e0f2fe"/>
      <rect x="346" y="84" width="320" height="100" rx="8" fill="#e0f2fe"/>
      <rect x="748" y="84" width="340" height="100" rx="8" fill="#e0f2fe"/>
      <rect x="346" y="231" width="320" height="104" rx="8" fill="#fff7ed"/>
      <rect x="748" y="231" width="340" height="104" rx="8" fill="#eef2ff"/>
    </g>
    <g font-size="16">
      <text x="48" y="112" font-weight="bold">48-byte packet prefix P</text>
      <text x="48" y="139">P+0: internal selector byte</text>
      <text x="48" y="163">P+4: channel byte</text>
      <text x="362" y="112" font-weight="bold">Compare with cached context</text>
      <text x="362" y="139">channel @ ARC-local 3FFFC094</text>
      <text x="362" y="163">selector @ ARC-local 3FFFC095</text>
      <text x="764" y="112" font-weight="bold">Dispatch cached selector</text>
      <text x="764" y="139">Ten branch words: 28D8..28FC</text>
      <text x="764" y="163">0, 1, 3, 4, 8, 9: selected paths</text>
      <text x="362" y="258" font-weight="bold">ContextSwap @ 23E0</text>
      <text x="362" y="283">Save / import / MMIO are opaque</text>
      <text x="362" y="307">Return unchecked; cache can update</text>
      <text x="362" y="325" font-size="13">even after invalid-channel / diagnostic paths</text>
      <text x="764" y="258" font-weight="bold">Internal paths, not host OPEN IDs</text>
      <text x="764" y="283">0 H264/H264P   1 MPEG   3 H263</text>
      <text x="764" y="307">4 VC1   8 MP4   9 AVS</text>
      <text x="764" y="325" font-size="13">Other values: diagnostics, not proven rejection</text>
    </g>
    <g stroke="#475569" stroke-width="2">
      <line x1="278" y1="134" x2="340" y2="134"/>
      <line x1="666" y1="134" x2="742" y2="134"/>
      <line x1="506" y1="184" x2="506" y2="225"/>
      <line x1="666" y1="283" x2="704" y2="283"/>
      <line x1="704" y1="283" x2="704" y2="170"/>
      <line x1="704" y1="170" x2="742" y2="170"/>
      <line x1="918" y1="184" x2="918" y2="225"/>
    </g>
    <g fill="#475569">
      <polygon points="338,129 346,134 338,139"/>
      <polygon points="740,129 748,134 740,139"/>
      <polygon points="501,223 506,231 511,223"/>
      <polygon points="740,165 748,170 740,175"/>
      <polygon points="913,223 918,231 923,223"/>
    </g>
    <g font-size="13" fill="#475569">
      <text x="286" y="119">DMA</text>
      <text x="682" y="119">equal</text>
      <text x="517" y="214">different</text>
      <text x="350" y="355">Forward only if opaque calls return</text>
    </g>
    <path d="M32 368 H1088" stroke="#cbd5e1"/>
    <text x="32" y="399" font-size="17" font-weight="bold">What this does NOT certify</text>
    <text x="32" y="426" font-size="16">Vendor ISA, successful context restoration, runtime reachability, codec support,</text>
    <text x="32" y="450" font-size="16">same-generation frame retention, or a parser-independent reconstruction API.</text>
  </g>
</svg>
