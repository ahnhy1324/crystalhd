<path d="M 491 551 H 539" stroke="#bb5b12" stroke-width="2.2" stroke-dasharray="6 4"/><circle cx="515" cy="551" r="4.3" fill="white" stroke="#bb5b12" stroke-width="2"/><text x="552" y="556" class="small">B: dashed input byte × 4, circles measured</text>
<text x="44" y="591" class="body">68 / 68 sampled Y/C pairs match · A′ and B′ duplicate their original full raw series</text>
<text x="44" y="622" class="small">Each probe: 17 observations, 16 attempted host pulse pairs, one START; all feeder error samples = 0.</text>
<text x="44" y="647" class="small">Post-W9 TEST readback = 8 on all 64 attempts; pulse/latch semantics and accepted-transfer counts remain unproved.</text>
<rect x="34" y="667" width="1212" height="142" rx="8" fill="#fff2dd"/>
<text x="52" y="697" class="panel">What remains unproved</text>
<text x="52" y="724" class="body">READY = 1, ACCEPT = 0 · LINE_COUNT = 1, LAST_LINE = 0 · EOF = 0 in recorded samples</text>
<text x="52" y="751" class="small">The component sequence repeats after eight snapshots; EOL is sampled at ordinals 8 and 16.</text>
<text x="52" y="777" class="small">Zero-address namespace units, fetch extent, source lifetime, downstream routing and completion are not established.</text>
<text x="44" y="840" class="small">All four probes aborted before CMAC / ARM run / firmware commands; cleanup succeeded with no retained resources.</text>
<text x="44" y="865" class="small">Sequential CSR samples are non-atomic; plotted fields are not a video capture or an accepted-transfer count.</text>
<text x="44" y="890" class="small">Controls: five 180-frame MPEG-2 downsamples and one 180-frame H.264 capture; all full pixels matched prior baselines.</text>
