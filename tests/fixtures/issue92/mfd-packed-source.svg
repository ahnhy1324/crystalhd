<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img" aria-labelledby="title desc">
<title id="title">BCM70015 measured packed-source component correspondence</title>
<desc id="desc">Four fresh pre-boot probes A, B, A repeat, B repeat. Every one of 68 sampled luma and chroma pairs equals the nominal little-endian source octets multiplied by four. Repeated raw series are identical. READY is one but ACCEPT, EOF and LAST_LINE are zero in recorded samples. These observations do not establish source extent, completion, a runtime lease or standalone processing.</desc>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#17283d}.heading{font-size:27px;font-weight:700}.panel{font-size:16px;font-weight:600}.body{font-size:17px}.small{font-size:14px}.axis{font-size:13px;fill:#52657d}.mono{font-family:DejaVu Sans Mono,monospace;font-size:16px}.grid{stroke:#dce4ed;stroke-width:1}</style>
<rect width="1280" height="910" fill="#f7f9fc"/>
<text x="44" y="48" class="heading">BCM70015: nonconstant packed input appears in MFD samples</text>
<text x="44" y="79" class="body">Real-card measurements · 2026-10-05 · four fresh pre-boot probes: A → B → A′ → B′</text>
<rect x="34" y="101" width="1212" height="98" rx="8" fill="#eaf0f7"/>
<text x="52" y="126" class="small">Nominal 16-byte YUY2 input · 96-byte PIO write/readback · remaining 80 bytes are padding, not a fetch bound</text>
<text x="52" y="154" class="mono" fill="#2b66c7">A: 31 55 42 aa 53 66 64 bb 75 77 86 cc 97 88 a8 dd</text>
<text x="52" y="180" class="mono" fill="#bb5b12">B: ce aa bd 55 ac 99 9b 44 8a 88 79 33 68 77 57 22</text>
