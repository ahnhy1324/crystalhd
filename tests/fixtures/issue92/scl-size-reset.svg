  <text x="28" y="688" font-size="21" font-weight="700">Persistent retirement duty: not discharged at the tuple checkpoint</text>
  <rect x="28" y="704" width="1224" height="115" rx="10" fill="#eef3fb"/>
  <text x="46" y="734" class="note">Arm duty → three fixed size attempts → checked stock core reset / DDR-idle</text>
  <text x="46" y="763" class="note">→ two pre-clock retirement tuples → rest of stock stop → checked PCI/current → clear duty</text>
  <text x="46" y="792" class="note muted">On failure: retain backing/session/module and quarantine; no retry, live-size restore or forced unload.</text>
  <text x="28" y="858" font-size="21" font-weight="700">Native stock-module controls: complete pixels and real firmware EOS</text>
  <text x="40" y="891" class="note">Before A, MPEG-2 downscale: 180 frames · 320×180 · 20,736,000 bytes · full comparison PASS</text>
  <text x="40" y="919" class="note">After A, MPEG-2 downscale: 180 frames · 320×180 · 20,736,000 bytes · full comparison PASS</text>
