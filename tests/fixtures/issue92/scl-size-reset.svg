  <text x="46" y="1030" class="note" font-weight="700">Configuration only: three size attempts, zero TOP / ENABLE / selector / feed START / pattern writes.</text>
  <text x="46" y="1059" class="note">Official firmware staging and existing stock reset/stop operations still execute; no firmware boot or DATA read.</text>
  <text x="46" y="1088" class="note">The samples are non-atomic. TOP=0x0c does not certify harmless shadow writes or picture-boundary latching.</text>
  <text x="46" y="1117" class="note">Paired reset readbacks and host PCI checks do not prove all-consumer quiescence or a source/sink lease.</text>
  <text x="46" y="1146" class="note">No route, accepted picture, completion or standalone raw MFD/SCL/CSC/DNR backend is established.</text>
