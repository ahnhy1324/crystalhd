<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title desc">
  <title id="title">Measured SCL size write and reset reversion, issue 92</title>
  <desc id="desc">Two fresh pre-CMAC sessions wrote exactly three raw SCL size words 00040002. Two complete request samples and two pre-clock retirement samples per session show those three words reverting to 02d000f0 after the stock reset. No custom TOP, ENABLE, selector, feed START or source-pattern writes. Full-byte native video recovery passes. Not active-latching, pixel units or all-consumer proof.</desc>
