<text x="28" y="547" font-size="13" fill="#acbace">One pre-START plus 17 active snapshots per feed session; all sampled SCL status components=0. Columns are ordinals, not time.</text>
<text x="28" y="570" font-size="13" fill="#acbace">READY only at ordinals 0–7; ACCEPT never sampled high. Flat DATA does not establish routing, its absence, output, idle or completion.</text>
<text x="28" y="593" font-size="13" fill="#acbace">Per feed: 16 host pulse pairs, 42 MFD + 2 SCL register writes. These bounds do not certify physical emitted/accepted beats.</text>
<text x="28" y="616" font-size="13" fill="#acbace">Stock cleanup passed for all six probes; eight native 180-frame controls matched frozen pixels/EOS/resources; original module restored.</text>
