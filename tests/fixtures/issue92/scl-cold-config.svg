<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
  <title id="title">Measured cold SCL configuration, issue 92</title>
  <desc id="desc">Four complete non-atomic 14-word tuples in two fresh pre-CMAC sessions are equal. Vertical mode bypass and horizontal defined control bits zero. BVB input, source and destination HSIZE/VSIZE fields 720/240; enable zero. Native full-pixel and EOS recovery controls pass. No activation, output, clock or ownership proof.</desc>
