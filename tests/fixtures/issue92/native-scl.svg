<text x="28" y="616" font-size="13" fill="#acbace">Opening REV=0x80 / TOP=0x0c throughout. Closing REV=0x80 for completed passes; not read after failed STATUS.</text>
<text x="28" y="640" font-size="13" fill="#acbace">Initial STATUS 0x5 = SHORT_SOURCE | SHORT_LINE; revised 0x1 = SHORT_LINE. Both stop, remain FAIL; cause/timing unproved.</text>
<text x="28" y="664" font-size="13" fill="#acbace">Source 8b10f217: observe before owned-copy Write. Revised 8902564d: Write first, then observe; failure thresholds unchanged.</text>
<text x="28" y="688" font-size="13" fill="#acbace">Both 320 runs hash 180 delivered pictures to the frozen oracle; revised full file matches. Neither reaches the delivery EOS barrier.</text>
<text x="28" y="712" font-size="13" fill="#acbace">Eight unobserved controls and two observed controls pass. All twelve clean up; original module/files preserved, kernel check passes.</text>
<text x="28" y="736" font-size="13" fill="#acbace">Equal raw passes are not atomic/transport/clock certificates. No raw-source lease, independent routing or all-consumer completion proof.</text>
