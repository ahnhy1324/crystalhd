<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
<title>BCM70015: native feeder framing versus preboot observations</title>
<desc>Two thirty-read native MPEG-2 trials completed with full-byte output controls. Sampled fields differ from the static preboot tuple; zero sync bits occur in successful native sessions too. Sequential differences do not prove accepted transfer, MFD participation, raw routing or a root cause.</desc>
<rect width="1280" height="650" fill="#f3f6fb"/>
<g font-family="DejaVu Sans, sans-serif" fill="#142236">
<text x="32" y="40" font-size="25" font-weight="bold">Native framing: observable contrast, not a routing proof</text>
<text x="32" y="67" font-size="14">BCM70015 · two fixed trials · 30 API reads each · no custom register writes or selector changes</text>
<rect x="32" y="87" width="1216" height="78" rx="10" fill="#e7eef7"/>
<text x="48" y="112" font-size="15" font-weight="bold">Pre-START: both trials, both passes</text>
<text x="48" y="139" font-size="14">SAMPLE=00000000 · FEED_STATUS=00000000 · BVB_STATUS=00000000 · REV=50 throughout</text>
<rect x="32" y="182" width="1216" height="230" rx="10" fill="#ffffff"/>
<text x="44" y="207" font-size="13" fill="#53657a">Sequential pass 0 → pass 1</text>
<text x="260" y="207" font-size="14" font-weight="bold">Trial A · frame 1</text>
<text x="502" y="207" font-size="14" font-weight="bold">Trial A · frame 90</text>
<text x="744" y="207" font-size="14" font-weight="bold">Repeat · frame 1</text>
<text x="986" y="207" font-size="14" font-weight="bold">Repeat · frame 90</text>
<text x="44" y="240" font-size="13">BVB_SAMPLE_DATA</text>
<text x="260" y="240" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#14563d">000b4089 → 001b819d</text>
<text x="502" y="240" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#14563d">000910d8 → 000910d8</text>
<text x="744" y="240" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#14563d">001291b8 → 000293c0</text>
<text x="986" y="240" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#14563d">001d2248 → 000d2040</text>
<text x="44" y="276" font-size="13">LINE_COUNT (raw)</text>
<text x="260" y="276" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">60 → 62</text>
<text x="502" y="276" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">8 → 8</text>
