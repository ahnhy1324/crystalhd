<rect x="32" y="429" width="1216" height="88" rx="10" fill="#fff1d8"/>
<text x="48" y="454" font-size="15" font-weight="bold">Preboot reference (#247): SAMPLE=00040168 · FEED_STATUS=00000001 · BVB_STATUS=00000000</text>
<text x="48" y="481" font-size="14">Zero picture/line-sync bits appear in both successful native sessions and preboot trials: not a failure classifier alone.</text>
<text x="48" y="503" font-size="13">Different stimulus, configuration and native/preboot state. The tuples do not distinguish geometry/framing from backpressure.</text>
<rect x="32" y="532" width="1216" height="55" rx="10" fill="#e1f2e8"/>
<text x="48" y="556" font-size="15" font-weight="bold">6 × 180 frames: full-byte native oracle, firmware EOS, empty queues and cleanup all passed</text>
<text x="48" y="577" font-size="13">Five MPEG-2 controls + one separate H.264 control · fd/thread counts restored · RSS +1,232…1,488 KiB</text>
<text x="32" y="615" font-size="14">Not proved: freshness, ACCEPT, MFD participation, source/sink lease, standalone output or root cause.</text>
<text x="32" y="638" font-size="12" fill="#53657a">Frame labels are host output-release milestones, not identities of the pixels sampled. Original issue #92 remains incomplete.</text>
</g>
</svg>
