<text x="260" y="384" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#845d17">0/0 → 0/0</text>
<text x="502" y="384" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#845d17">0/0 → 0/0</text>
<text x="744" y="384" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#845d17">0/0 → 0/0</text>
