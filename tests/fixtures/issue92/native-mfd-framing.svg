<text x="260" y="312" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">0 → 1</text>
<text x="502" y="312" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">0 → 0</text>
<text x="744" y="312" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">1 → 0</text>
<text x="986" y="312" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">1 → 0</text>
<text x="44" y="348" font-size="13">EOF / EOL</text>
<text x="260" y="348" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">1/1 → 0/1</text>
<text x="502" y="348" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#14563d">1/1 → 0/0</text>
