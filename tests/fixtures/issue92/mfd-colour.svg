<text x="32" y="445" font-size="16" fill="#77d6bb">Both colours: observed Y / Cb / Cr = programmed 8-bit values × 4.</text>
<text x="32" y="471" font-size="13">Samples and BVB_OUT tap low 26 bits agreed. Feeder error flags stayed zero. Observations 9–16: READY=0.</text>
<text x="32" y="497" font-size="13">Stock stop/reset + checked post-stop PCI guard succeeded; native H.264 recovery matched the frozen pixels.</text>
<text x="32" y="532" font-size="13" fill="#efcf8f">Local generator evidence only: not DRAM-source ownership/bypass, scaler/capture or all-engine completion.</text>
<text x="32" y="552" font-size="12" fill="#acbace">Raw hsize=8, window=0, retained stride=0x00800080; units and reserved packed-stride behaviour remain experimental.</text>
