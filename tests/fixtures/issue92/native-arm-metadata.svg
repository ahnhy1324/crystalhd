<title id="title">Native ARM cache observations in two H264 sessions</title>
<desc id="desc">Both native 180-frame captures match the full frozen pixel oracle. Trial B changes cached metadata and source words between two sequential passes. Repeated metadata addresses coexist with changed cached sources. These observations do not certify atomicity, exact frame identity, source extent, generation, ownership, or all-consumer completion.</desc>
