  <text x="29" y="199" transform="rotate(-90 29 199)" text-anchor="middle">Cb byte value</text>
  <text x="438" y="357" text-anchor="middle">Chroma sample index (two luma pixels per sample)</text>
  <polyline points="74.0,274.7 114.4,274.7 154.9,274.7 195.3,274.7 235.8,274.7 276.2,274.7 316.7,274.7 357.1,276.8 397.6,270.4 438.0,141.6 478.4,135.2 518.9,137.3 559.3,137.3 599.8,137.3 640.2,137.3 680.7,137.3 721.1,137.3 761.6,137.3 802.0,137.3" fill="none" stroke="#334155" stroke-width="2.5"/>
