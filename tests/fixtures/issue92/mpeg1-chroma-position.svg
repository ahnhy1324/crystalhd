<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" role="img" aria-labelledby="title desc">
  <title id="title">Measured MPEG-1 chroma edge and sample-position reference</title>
  <desc id="desc">Actual BCM70015 captures, first frame and first Cb row, progressive 352 by 288. Chroma samples 35 through 53 are shown. The decoded planar reference and native MPEG-2 card values are identical in this window. The MPEG-1 card and explicitly resited FFmpeg Lanczos values are identical in this window, not throughout the frame. Native MPEG-1 30-I and 90-I/P/B luma matched software throughout. Sequential MFD configuration observations are not write causality, atomic readback, general pixel equivalence or a source lease.</desc>
  <rect width="880" height="466" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#334155">
  <text x="34" y="33" font-size="20" font-weight="600">MPEG-1 chroma: sample position changes the reference</text>
  <text x="34" y="59">Measured first-frame Cb edge · 352 × 288 · first chroma row</text>
  <path d="M 74 309.0 H 802" stroke="#e2e8f0"/>
  <text x="61" y="314.0" text-anchor="end">16</text>
  <path d="M 74 274.7 H 802" stroke="#e2e8f0"/>
  <text x="61" y="279.7" text-anchor="end">32</text>
  <path d="M 74 206.0 H 802" stroke="#e2e8f0"/>
  <text x="61" y="211.0" text-anchor="end">64</text>
  <path d="M 74 137.3 H 802" stroke="#e2e8f0"/>
  <text x="61" y="142.3" text-anchor="end">96</text>
  <path d="M 74 103.0 H 802" stroke="#e2e8f0"/>
  <text x="61" y="108.0" text-anchor="end">112</text>
