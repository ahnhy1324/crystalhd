  <text x="195.3" y="334" text-anchor="middle">38</text>
  <text x="316.7" y="334" text-anchor="middle">41</text>
  <text x="438.0" y="334" text-anchor="middle">44</text>
  <text x="559.3" y="334" text-anchor="middle">47</text>
  <text x="680.7" y="334" text-anchor="middle">50</text>
  <text x="802.0" y="334" text-anchor="middle">53</text>
