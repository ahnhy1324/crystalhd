<text x="28" y="505" font-size="14" fill="#efcf8f">Measured bank/latch response only: not scaler output, pixel routing, engine idle or completion.</text>
<text x="28" y="529" font-size="12" fill="#acbace">The helper writes only the selector twice. Stock device initialization, staging and stop/reset still run.</text>
