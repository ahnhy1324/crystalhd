<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Cold scaler ENABLE request and stock-reset observations</title>
  <desc id="desc">Two trials observed ENABLE one with three raw size words 00040002, then ENABLE zero and original size words 02d000f0 before stock powerdown. Four ordinary H264 controls matched all 720 frames. This is not standalone processing or a source lease.</desc>
  <rect width="960" height="470" fill="#f8fafc"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
    <text x="36" y="40" font-size="23" font-weight="bold">BCM70015: ENABLE request → stock reset</text>
    <text x="36" y="66" font-size="14" fill="#475569">Two repeated physical trials; complete, non-atomic register pairs</text>
    <rect x="36" y="96" width="264" height="220" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="348" y="96" width="264" height="220" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <rect x="660" y="96" width="264" height="220" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="54" y="124" font-size="16" font-weight="bold">Required cold profile</text>
    <text x="366" y="124" font-size="16" font-weight="bold">Request: observed twice</text>
    <text x="678" y="124" font-size="16" font-weight="bold">Reset: observed twice</text>
    <text x="54" y="166" font-size="26" font-weight="bold">ENABLE = 0</text>
    <text x="366" y="166" font-size="26" font-weight="bold">ENABLE = 1</text>
    <text x="678" y="166" font-size="26" font-weight="bold">ENABLE = 0</text>
    <g font-size="13" font-family="DejaVu Sans Mono, monospace">
      <text x="54" y="197">TOP:  0x0000000c</text>
      <text x="366" y="197">TOP:  0x0000000c</text>
      <text x="678" y="197">TOP:  0x0000000c</text>
      <text x="54" y="223">BVB:  0x02d000f0</text>
      <text x="54" y="247">SRC:  0x02d000f0</text>
      <text x="54" y="271">DEST: 0x02d000f0</text>
      <text x="366" y="223">BVB:  0x00040002</text>
      <text x="366" y="247">SRC:  0x00040002</text>
      <text x="366" y="271">DEST: 0x00040002</text>
      <text x="678" y="223">BVB:  0x02d000f0</text>
      <text x="678" y="247">SRC:  0x02d000f0</text>
      <text x="678" y="271">DEST: 0x02d000f0</text>
    </g>
    <g fill="#475569">
      <path d="M309 196h24l-7-7m7 7-7 7" fill="none" stroke="#475569" stroke-width="2"/>
      <path d="M621 196h24l-7-7m7 7-7 7" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="54" y="296" font-size="12">Admission requirement</text>
      <text x="366" y="296" font-size="12">3 size attempts + 1 ENABLE attempt</text>
      <text x="678" y="296" font-size="12">Before stock powerdown</text>
    </g>
    <rect x="36" y="335" width="888" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="361" font-size="16" font-weight="bold">Ordinary H.264 controls: 4 × 180 frames, full-byte equality</text>
    <text x="54" y="385" font-size="13" fill="#475569">EOS and cleanup passed; installed module restored; installed files unchanged.</text>
    <text x="36" y="427" font-size="12" fill="#92400e">Raw size words do not establish pixel units. No MFD START or source-pattern write was issued.</text>
    <text x="36" y="449" font-size="12" fill="#92400e">Readback/reset is not accepted-input, active-bank, functional-clock, consumer-fence or source-lease proof.</text>
  </g>
</svg>
