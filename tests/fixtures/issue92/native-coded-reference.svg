<g data-au="10" data-frame-num="5" data-poc="10" data-reference="true"><rect x="900" y="280" width="80" height="83" class="box ref" fill="#174e43" stroke="#83a0b9"/><text fill="#e4edf6" x="908" y="302" class="small">f10 / REF</text><text fill="#e4edf6" x="908" y="325" class="small">C / end</text><text fill="#e4edf6" x="908" y="348" class="small">fn 5 / p 10</text></g>
<g data-au="11" data-frame-num="6" data-poc="11" data-reference="false"><rect x="987" y="280" width="80" height="83" class="box nr" fill="#26394d" stroke="#83a0b9"/><text fill="#e4edf6" x="995" y="302" class="small">f11 / NR</text><text fill="#e4edf6" x="995" y="325" class="small">ST C</text><text fill="#e4edf6" x="995" y="348" class="small">fn 6 / p 11</text></g>
<text fill="#e4edf6" x="30" y="400" class="body">f6 replacement: A uses MMCO2 + 6; B / C use MMCO6 alone.</text>
<text fill="#e4edf6" x="30" y="430" class="body">f10: A / B retire LT0 (MMCO2); C keeps LT0. f11 reads newest short-term C.</text>
<text fill="#e4edf6" x="30" y="470" class="body">Controls: MPEG-2 32 + H264 180; total 248 frames / 20,938,752 bytes, whole cmp PASS.</text>
<text fill="#e4edf6" x="30" y="500" class="body">All five sessions: firmware EOS, empty queues, cleanup PASS; unchanged FD / thread counts.</text>
<text fill="#e4edf6" x="30" y="548" class="body">No added PPB / DRAM observer or diagnostic target writes; invalid input stayed CPU-only.</text>
<text fill="#e4edf6" x="30" y="582" class="body">Same positive pixels do not prove retirement/freeing or a physical/raw-source lease.</text>
</svg>
