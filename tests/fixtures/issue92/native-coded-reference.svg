<g data-frame="6" data-luma-sha256="e07e1f68503010599d90e9991f896b6fa7f79e622574e06b1fcdf92a38e64335" data-png-sha256="2a64f14cec31632f89d688924c35c085ea68c5f12006d0a2f65eac4d0555fda9"><image x="570" y="100" width="256" height="96" href="data:image/png;base64," style="image-rendering:pixelated"/><text fill="#e4edf6" x="570" y="220" class="small">f6: replaced LT0 with B</text></g>
<g data-frame="8" data-luma-sha256="c13117b86e7159fa67c0c6c29816b9d4a0b4aa29d1a15a5eac4b4d4097da7a7f" data-png-sha256="3ccbc9b6ffc50070f2843275a3135339890ea0908a832aa1c3adde4ae6975961"><image x="840" y="100" width="256" height="96" href="data:image/png;base64," style="image-rendering:pixelated"/><text fill="#e4edf6" x="840" y="220" class="small">f8: B +16px after NR f7</text></g>
<text fill="#e4edf6" x="30" y="254" class="small">Native Y samples, every second row/column; thumbnails are illustrative, whole YUY2 cmp is the test.</text>
