<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Native H264 coded reference lifecycle</title>
<desc id="desc">Four downsampled native luma images and the twelve-picture reference lifecycle. All three valid variants matched the preselected full pixel oracle. Physical source leasing is not established.</desc>
<style>text{font-family:Arial,sans-serif;fill:#e4edf6}.title{font-size:25px;font-weight:bold}.body{font-size:16px}.small{font-size:13px}.ref{fill:#174e43}.nr{fill:#26394d}.box{stroke:#83a0b9;stroke-width:1}</style>
<rect width="1100" height="620" fill="#101c2a"/>
<text fill="#e4edf6" x="30" y="42" class="title">Coded reference hold and replacement: native pixel check</text>
<text fill="#e4edf6" x="30" y="74" class="body">A / B / C: 12 / 12 frames each, all 589,824 packed bytes equal the frozen oracle</text>
<g data-frame="0" data-luma-sha256="fd4f555bb071a299fdb0ce216b8dd4c760ed213b63249348e976961b3a5cea02" data-png-sha256="845559eee14235c7df9976b7434725c6d2971e29746d1a11072192acb60d3a7d"><image x="30" y="100" width="256" height="96" href="data:image/png;base64," style="image-rendering:pixelated"/><text fill="#e4edf6" x="30" y="220" class="small">f0: uploaded A / LT0</text></g>
