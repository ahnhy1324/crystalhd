    <text x="40" y="68" font-size="16">256×96 → 128×48 · source x128 +=32 · signed output luma difference from each baseline</text>
    <path d="M42 96 H76" stroke="#bc3c25" stroke-width="3"/>
    <text x="86" y="101" font-size="15">Profile2 −0: ramp +32 versus ramp</text>
