<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title description">
  <title id="title">Effective decoder-mediated path: same impulse, different background</title>
  <desc id="description">Actual support-score.json signed luma response vectors, output x58 through70. Both inputs add32 at source x128. Profile2 minus ramp baseline0: 0,0,0,-1,1,3,13,-1,0,0,0,0,0. Profile11 minus flat baseline10: 0,0,0,0,0,4,12,0,0,0,0,0,0. The frozen four-local-support hypothesis allows changes only at x63 and64. Ramp responses at x61=-1, x62=+1 and x65=-1 are outside that support. This rejects the stated stateless locality hypothesis, not a particular physical filter block.</desc>
  <metadata>Source: native-scl-exact-source.json cases.support.model_result, retained from support-score.json; responses profile2/baseline0 and profile11/baseline10; signed_luma_delta128[58:71]. Geometry256x96 to128x48. Values copied from actual recorded vectors, not inferred measurements.</metadata>
