# DKMS configuration for crystalhd

PACKAGE_NAME="crystalhd"
PACKAGE_VERSION="3.10.0"
BUILT_MODULE_NAME[0]="$PACKAGE_NAME"
BUILT_MODULE_LOCATION[0]=driver/linux
DEST_MODULE_LOCATION[0]="/updates/dkms/"
AUTOINSTALL=yes

MAKE[0]="make -C driver/linux -f Makefile.in KVER=$kernelver KDIR=/lib/modules/$kernelver/build"
CLEAN="make -C driver/linux -f Makefile.in clean"

POST_INSTALL="install_firmware_dkms.sh"
