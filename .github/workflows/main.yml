name: CrystalHD CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf gcc-multilib g++-multilib qemu-user \
            linux-headers-generic \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            libva-dev libdrm-dev libgbm-dev \
            libswscale-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            nodejs node-ws

      - name: Select packaged kernel headers
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d \
            -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$KDIR"
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "KVER=${KDIR##*/linux-headers-}" >> "$GITHUB_ENV"

      - name: Build 32-bit userspace ABI
        run: make userspace32-check

      - name: Validate legacy i686 without SSE
        run: make legacy-cpu-check

      - name: Check native V4L2 models on the 32-bit ABI
        run: make v4l2-parent-check CFLAGS='-m32 -march=i686 -mno-sse -mno-sse2 -mfpmath=387'

      - name: Build and test
        env:
          # Hosted Node must also find Ubuntu's apt-installed node-ws.
          NODE_PATH: /usr/share/nodejs
        run: |
          node -e 'require("ws")'
          make -j2 W=1 check KDIR="$KDIR" KVER="$KVER"

      - name: Verify optional V4L2 module integration
        shell: bash
        run: |
          v4l2_imports=$(nm -u driver/linux/crystalhd.ko)
          if grep -q 'v4l2_device_' <<< "$v4l2_imports"; then
            echo 'unexpected V4L2 import in the default module' >&2
            exit 1
          fi
          make -j2 W=1 driver CRYSTALHD_V4L2=1 KDIR="$KDIR" KVER="$KVER"
          v4l2_imports=$(nm -u driver/linux/crystalhd.ko)
          grep -q 'v4l2_device_register' <<< "$v4l2_imports"
          grep -q 'v4l2_device_unregister' <<< "$v4l2_imports"
          grep -q 'v4l2_device_put' <<< "$v4l2_imports"
          make -j2 W=1 driver CRYSTALHD_V4L2=0 KDIR="$KDIR" KVER="$KVER"
          v4l2_imports=$(nm -u driver/linux/crystalhd.ko)
          if grep -q 'v4l2_device_' <<< "$v4l2_imports"; then
            echo 'V4L2 import remains after disabling the optional build' >&2
            exit 1
          fi

      - name: Verify seek regression test against software decoding
        run: |
          sh tests/generate-h264-samples.sh "$RUNNER_TEMP/h264-samples"
          make -C filters/vaapi seek-test
          filters/vaapi/vaapi-seek-test "$RUNNER_TEMP/h264-samples/high.mp4" --software
          filters/vaapi/vaapi-seek-test "$RUNNER_TEMP/h264-samples/high.mp4" --software --lookahead 8
          filters/vaapi/vaapi-seek-test "$RUNNER_TEMP/h264-samples/high.mp4" --software --retain-old-frames
          make library-drain-test
          ffmpeg -nostdin -hide_banner -loglevel error -n \
            -i "$RUNNER_TEMP/h264-samples/high.mp4" -map 0:v:0 -c:v copy \
            -bsf:v h264_mp4toannexb -f h264 "$RUNNER_TEMP/drain.h264"
          LD_LIBRARY_PATH="$PWD/linux_lib/libcrystalhd" tests/library-drain-test \
            --preflight "$RUNNER_TEMP/drain.h264" 180
          probe_status=0
          LD_LIBRARY_PATH="$PWD/linux_lib/libcrystalhd" tests/library-drain-test \
            --preflight "$RUNNER_TEMP/drain.h264" 179 || probe_status=$?
          test "$probe_status" -eq 2

      - name: Verify local audio/video controls against software decoding
        run: |
          sh tests/generate-browser-sample.sh "$RUNNER_TEMP/av360.mp4" --av-360p
          timeout --kill-after=5 90 filters/gst/gst-plugin-1.0/gstreamer-controls-test \
            "$RUNNER_TEMP/av360.mp4" --software --audio --timeout 75

      - name: Verify MPEG-2 seek probe against software decoding
        run: |
          ffmpeg -nostdin -hide_banner -loglevel error -xerror -n \
            -f lavfi -i testsrc2=size=640x360:rate=30 -frames:v 180 \
            -c:v mpeg2video -threads 1 -profile:v main -level:v 8 \
            -g 12 -bf 2 -q:v 4 -flags +cgop -sc_threshold 1000000000 \
            "$RUNNER_TEMP/mpeg2-closed.mov"
          filters/vaapi/vaapi-seek-test "$RUNNER_TEMP/mpeg2-closed.mov" --software
          filters/vaapi/vaapi-seek-test "$RUNNER_TEMP/mpeg2-closed.mov" --software --lookahead 8
          filters/vaapi/vaapi-seek-test "$RUNNER_TEMP/mpeg2-closed.mov" --software --retain-old-frames

  upstream-kernel-api:
    name: Kernel API (${{ matrix.track }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track:
          - lts-5.15
          - lts-6.1
          - lts-6.6
          - lts-6.12
          - lts-6.18
          - stable
          - mainline
        arch:
          - x86_64
        include:
          - track: lts-5.15
            arch: i386
          - track: lts-6.1
            arch: i386
          - track: stable
            arch: i386

    steps:
      - name: Checkout CrystalHD
        uses: actions/checkout@v7

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex gcc-multilib git libelf-dev libssl-dev

      - name: Resolve current upstream kernel
        run: |
          banner=$(curl -fsSL https://www.kernel.org/finger_banner)
          case "${{ matrix.track }}" in
            stable)
              version=$(printf '%s\n' "$banner" | sed -n \
                's/^The latest stable version of the Linux kernel is:[[:space:]]*//p')
              repository=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
              ;;
            mainline)
              version=$(printf '%s\n' "$banner" | sed -n \
                's/^The latest mainline version of the Linux kernel is:[[:space:]]*//p')
              repository=https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
              ;;
            lts-*)
              series=${{ matrix.track }}
              series=${series#lts-}
              version=$(printf '%s\n' "$banner" | awk -v series="$series" \
                'index($0, "longterm " series " version") {
                   sub(/^.*:[[:space:]]*/, ""); print
                 }')
              repository=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
              ;;
          esac
          test -n "$version"
          echo "KERNEL_VERSION=$version" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$RUNNER_TEMP/linux-$version" >> "$GITHUB_ENV"
          echo "KERNEL_REPOSITORY=$repository" >> "$GITHUB_ENV"

      - name: Prepare upstream kernel headers
        run: |
          git clone --quiet --depth 1 --branch "v$KERNEL_VERSION" \
            "$KERNEL_REPOSITORY" "$KERNEL_DIR"
          make -s -C "$KERNEL_DIR" ARCH="${{ matrix.arch }}" defconfig
          # Select hidden mem2mem and DMA-SG support through real drivers.
          # Setting those hidden symbols directly is lost by olddefconfig.
          media_config() {
            mode=$1
            symbol=$2
            if ! git -C "$KERNEL_DIR" grep -q -E \
                "^[[:space:]]*(menu)?config[[:space:]]+$symbol([[:space:]]|$)" \
                -- '*Kconfig*'; then
              echo "Required kernel configuration symbol missing: $symbol" >&2
              exit 1
            fi
            "$KERNEL_DIR/scripts/config" --file "$KERNEL_DIR/.config" \
              "$mode" "$symbol"
          }
          for symbol in MODULES PCI SOUND SND MEDIA_SUPPORT MEDIA_SUPPORT_FILTER \
              MEDIA_CAMERA_SUPPORT MEDIA_TEST_SUPPORT VIDEO_DEV MEDIA_PCI_SUPPORT \
              V4L_TEST_DRIVERS; do
            media_config --enable "$symbol"
          done
          media_config --module VIDEO_VIM2M
          media_config --module VIDEO_TW686X
          make -s -C "$KERNEL_DIR" ARCH="${{ matrix.arch }}" olddefconfig
          for symbol in VIDEO_DEV V4L2_MEM2MEM_DEV VIDEOBUF2_DMA_SG; do
            if ! grep -Eq "^CONFIG_${symbol}=(y|m)$" "$KERNEL_DIR/.config"; then
              echo "Optional frontend dependency was not selected: $symbol" >&2
              exit 1
            fi
          done
          make -s -j2 -C "$KERNEL_DIR" ARCH="${{ matrix.arch }}" modules_prepare

      - name: Compile CrystalHD kernel API
        run: |
          # Exercise both configurations and switching back in every kernel/
          # architecture entry. Kbuild tracks changed commands and object lists.
          for frontend in 0 1 0; do
            echo "Compile CRYSTALHD_V4L2=$frontend"
            make -C "$KERNEL_DIR" \
              ARCH="${{ matrix.arch }}" \
              M="$GITHUB_WORKSPACE/driver/linux" \
              CRYSTALHD_V4L2="$frontend" W=1 crystalhd.o
          done
